name: CI

# Tests the site code itself. Contributor files are checked by check-contribution.yml.
on:
  pull_request:
    paths-ignore: ['contributors/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: npm run build:offline
